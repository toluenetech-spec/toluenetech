name: Deploy Worker

on:
  push:
    branches: [arena/01a09826-toluenetech]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Create preview R2 bucket (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create toluenetech-assets-dev || true

      - name: Write production .dev.vars
        run: |
          cat > server/.dev.vars <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AI_PROVIDER=${{ secrets.AI_PROVIDER }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=${{ secrets.AI_MODEL }}
          ASSISTANT_SECRET=${{ secrets.ASSISTANT_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EOF

      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          while read -r line; do
            [ -z "$line" ] && continue
            name="${line%%=*}"
            value="${line#*=}"
            [ -z "$value" ] && continue
            echo "  secret: $name"
            echo "$value" | npx wrangler secret put "$name" --config server/wrangler.toml
          done < server/.dev.vars

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy server/src/index.ts --config server/wrangler.toml
