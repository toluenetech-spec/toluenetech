name: Deploy Worker

on:
  push:
    branches: [arena/01a09826-toluenetech]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Wrangler is already in devDependencies)
        run: npm install

      - name: Create preview R2 bucket (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5ba6343e7dbce7708785cffe6d9e55ae"
        run: npx wrangler r2 bucket create toluenetech-assets-dev --config server/wrangler.toml || true

      - name: Upload DATABASE_URL secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5ba6343e7dbce7708785cffe6d9e55ae"
        run: echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL --config server/wrangler.toml

      - name: Optional AI secrets (only if set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5ba6343e7dbce7708785cffe6d9e55ae"
        run: |
          if [ -n "${{ secrets.AI_PROVIDER }}" ]; then echo "${{ secrets.AI_PROVIDER }}" | npx wrangler secret put AI_PROVIDER --config server/wrangler.toml; fi
          if [ -n "${{ secrets.AI_API_KEY }}" ];  then echo "${{ secrets.AI_API_KEY }}"  | npx wrangler secret put AI_API_KEY  --config server/wrangler.toml; fi
          # Default admin/client model to MiniMax-M2.7 on Dahl unless overridden.
          if [ -n "${{ secrets.AI_MODEL }}" ];    then echo "${{ secrets.AI_MODEL }}"    | npx wrangler secret put AI_MODEL    --config server/wrangler.toml; fi
          # Public-visitor model defaults to DeepSeek-V3-Flash for speed; override with AI_MODEL_PUBLIC secret.
          PUBLIC_MODEL="${{ secrets.AI_MODEL_PUBLIC }}"
          if [ -z "$PUBLIC_MODEL" ] && [ "${{ secrets.AI_PROVIDER }}" = "dahl" ]; then PUBLIC_MODEL="deepseek-ai/DeepSeek-V3-Flash"; fi
          if [ -n "$PUBLIC_MODEL" ]; then echo "$PUBLIC_MODEL" | npx wrangler secret put AI_MODEL_PUBLIC --config server/wrangler.toml; fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5ba6343e7dbce7708785cffe6d9e55ae"
        run: npx wrangler deploy server/src/index.ts --config server/wrangler.toml
